<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Premium Izakaya Menu</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background: #f5f5f5;
        }


        h1 {
            text-align: center;
        }


        .box {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: white;
        }


        input {
            padding: 10px;
            font-size: 16px;
            width: 65%;
            box-sizing: border-box;
        }


        button {
            padding: 10px 15px;
            font-size: 16px;
            margin-left: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #007BFF;
            color: white;
        }


        button:hover {
            background: #0056b3;
        }


        pre {
            background: #eee;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }


        .dish {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }


        .dish:last-child {
            border-bottom: none;
        }


        .dish-name {
            font-size: 20px;
            font-weight: bold;
        }


        .category {
            color: #666;
            font-size: 14px;
        }


        .price {
            font-weight: bold;
            margin-top: 5px;
        }


        .ingredient {
            margin-top: 5px;
        }

    </style>

</head>


<body>


    <h1>🍣 Premium Izakaya</h1>

    <div class="box">

        <h2>Search Dishes</h2>

        <input
            type="text"
            id="searchQuery"
            placeholder="e.g. Salmon, Miso, Salad"
        >

        <button onclick="searchDish()">
            Search
        </button>

        <div id="searchResult">
            Search results will appear here.
        </div>

    </div>

    <div class="box">

        <h2>Menu Categories</h2>

        <button onclick="getCategories()">
            Show Categories
        </button>

        <pre id="categoryResult">
Categories will appear here.
        </pre>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        async function searchDish() {

            const query =
                document.getElementById("searchQuery").value.trim();

            const resultBox =
                document.getElementById("searchResult");

            if (!query) {

                resultBox.innerHTML =
                    "<p>Please enter a search term.</p>";

                return;
            }

            resultBox.innerHTML =
                "<p>Searching...</p>";


            try {

                const response = await fetch(
                    `${API_URL}/dish?query=${encodeURIComponent(query)}`
                );


                const data = await response.json();

                if (!response.ok) {

                    resultBox.innerHTML =
                        `<p>${data.detail || "Dish not found."}</p>`;

                    return;
                }

                resultBox.innerHTML = "";

                data.forEach(function(dish) {


                    const dishElement =
                        document.createElement("div");

                    dishElement.className = "dish";


                    const name =
                        document.createElement("div");

                    name.className = "dish-name";

                    name.textContent =
                        dish.name || "Unnamed dish";


                    const category =
                        document.createElement("div");

                    category.className = "category";

                    category.textContent =
                        "Category: " +
                        (dish.category || "Unknown");


                    const ingredient =
                        document.createElement("div");

                    ingredient.className = "ingredient";

                    if (dish.ingredient) {

                        ingredient.textContent =
                            "Ingredients: " +
                            dish.ingredient;

                    }


                    const description =
                        document.createElement("div");

                    description.textContent =
                        dish.description || "";


                    const price =
                        document.createElement("div");

                    price.className = "price";

                    if (dish.price !== undefined) {

                        price.textContent =
                            "Price: " +
                            dish.price +
                            " CZK";

                    }


                    dishElement.appendChild(name);

                    dishElement.appendChild(category);

                    dishElement.appendChild(ingredient);

                    dishElement.appendChild(description);

                    dishElement.appendChild(price);


                    resultBox.appendChild(dishElement);

                });


            } catch (error) {

                console.error(error);

                resultBox.innerHTML =
                    "<p>Error connecting to the backend server.</p>";

            }

        }

        async function getCategories() {

            const resultBox =
                document.getElementById("categoryResult");


            resultBox.textContent =
                "Loading categories...";


            try {

                const response =
                    await fetch(`${API_URL}/categories`);


                const data =
                    await response.json();


                if (!response.ok) {

                    resultBox.textContent =
                        data.detail || "Could not load categories.";

                    return;
                }


                resultBox.textContent =
                    data.join("\n");


            } catch (error) {

                console.error(error);

                resultBox.textContent =
                    "Error connecting to backend server.";

            }

        }

        document
            .getElementById("searchQuery")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    searchDish();

                }

            });


    </script>


</body>

</html>
